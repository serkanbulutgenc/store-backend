volumes:
  store_backend_local_postgres_data: {}
  store_backend_local_postgres_data_backups: {}
  store_backend_local_redis_data: {}
  store_backend_local_elasticsearch_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: store_backend_local_django
    container_name: store_backend_local_django
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: store_backend_production_postgres
    container_name: store_backend_local_postgres
    volumes:
      - store_backend_local_postgres_data:/var/lib/postgresql/data
      - store_backend_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: store_backend_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.10
    container_name: store_backend_local_redis
    volumes:
      - store_backend_local_redis_data:/data

  # Serves Search suggestions only. Local use: no security, a small heap.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    container_name: store_backend_local_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - store_backend_local_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      timeout: 5s
      retries: 30

  celeryworker:
    <<: *django
    image: store_backend_local_celeryworker
    container_name: store_backend_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: store_backend_local_celerybeat
    container_name: store_backend_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: store_backend_local_flower
    container_name: store_backend_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
