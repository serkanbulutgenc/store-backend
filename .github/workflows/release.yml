name: Release

# Cuts a SemVer tag on main. The git tag is the only source of truth for the version;
# the tag's image is published by publish.yml (tags pushed with GITHUB_TOKEN do not
# trigger workflows, so this dispatches it explicitly).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: next
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.next.outputs.tag }}
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"
          gh workflow run publish.yml --ref "$tag"
